[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuselect-ai"
version = "0.2.0"
description = "Evidence-first scientific workbench for Cu-based CO2RR catalyst research"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "ase>=3.23,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "nbformat>=5.10,<6", "matplotlib>=3.8,<4"]
app = ["streamlit>=1.40,<2", "plotly>=5.20,<7"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
